<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Word | Agencia de Viajes</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <nav class="glass-nav">
        <div class="logo">
            <h2>Retro<span>Word</span></h2>
        </div>
        <ul class="menu-links">
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#destinos">Destinos</a></li>
            <li><a href="#experiencias">Experiencias</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>

    <header id="inicio" class="hero">
        <div class="hero-content glass-card">
            <h1 class="anim-title">Descubre el Mundo a tu Manera</h1>
            <p class="anim-text">Viajes inolvidables diseñados exclusivamente para ti.</p>
            <button class="btn-primary anim-btn">Explorar Ahora</button>
        </div>
    </header>

    <main id="destinos" class="carousel-section">
        <h2 class="section-title">Paisajes Majestuosos</h2>
        
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=800&q=80" alt="Paisaje 1">
                    <div class="slide-info glass-card">Montañas del Norte</div>
                </div>
                <div class="swiper-slide">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" alt="Paisaje 2">
                    <div class="slide-info glass-card">Valles Profundos</div>
                </div>
                <div class="swiper-slide">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Paisaje 3">
                    <div class="slide-info glass-card">Costas Paraíso</div>
                </div>
                </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
